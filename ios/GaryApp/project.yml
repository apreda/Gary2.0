name: GaryApp
options:
  minimumXcodeGenVersion: 2.32.0
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 12.9.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
settings:
  base:
    DEVELOPMENT_TEAM: SFBTX6KPLM
    PRODUCT_BUNDLE_IDENTIFIER: ai.betwithgary.app
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Info.plist
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    MARKETING_VERSION: 2.26
    CURRENT_PROJECT_VERSION: 944
targets:
  GaryApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
          - project.yml
          - "*.example"
          - Book
          - Hub
          - Models
          - Home
          - Picks
          - Fonts
          - ci_scripts
          - supabase
      - path: Book
      - path: Hub
      - path: Models
      - path: Home
      - path: Picks
      - path: Fonts
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Lottie
        product: Lottie
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: GaryApp.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin:
          - Default
    scheme:
      testTargets: []
