<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gary's tape</title>
<style>
  @font-face { font-family: "Anton"; src: url("file:///Users/adam.preda/Gary2.0/GaryMarketing/ads/2026-10-04-sunday-spot/public/Anton-Regular.ttf"); }
  @font-face { font-family: "Bebas"; src: url("file:///Users/adam.preda/Gary2.0/GaryMarketing/ads/2026-10-04-sunday-spot/public/BebasNeue-Regular.ttf"); }
  @font-face { font-family: "Barlow"; src: url("file:///Users/adam.preda/Gary2.0/GaryMarketing/ads/2026-10-04-sunday-spot/public/BarlowCondensed-SemiBold.ttf"); }
  :root { --navy: #001741; --paper: #f3eee2; --ink: #17130f; --gold: #e2b95a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--navy); }
  .stage { position: relative; width: 1080px; height: 1350px;
    background: radial-gradient(900px 900px at 62% 58%, #17408f 0%, #0a2a66 38%, var(--navy) 78%); }
  .ticket { position: absolute; left: 48px; top: 40px; width: 640px; height: 1270px; transform: rotate(-1.6deg);
    filter: drop-shadow(0 26px 34px rgba(0, 6, 24, .55)); }
  .paper { position: absolute; inset: 0; background: var(--paper); color: var(--ink); padding: 48px 40px 36px; display: flex; flex-direction: column;
    --tooth: 22px;
    -webkit-mask:
      conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) 0 0 / var(--tooth) 14px repeat-x,
      conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) 0 100% / var(--tooth) 14px repeat-x,
      linear-gradient(#000 0 0) 0 13px / 100% calc(100% - 26px) no-repeat; }
  .paper::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .16 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  .mono { font-family: "Courier New", Courier, monospace; font-weight: 700; letter-spacing: .01em; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-family: "Bebas"; font-size: 52px; letter-spacing: .04em; line-height: 1; }
  .day { font-size: 22px; text-transform: uppercase; }
  .rule { border-top: 3px dashed var(--ink); margin: 13px 0; opacity: .8; flex: none; }
  .title { font-family: "Anton"; font-size: 84px; line-height: 1; text-transform: uppercase; }
  .lines { flex: 1; min-height: 0; overflow: hidden; }
  .row { display: flex; justify-content: space-between; white-space: nowrap; }
  .row.miss { opacity: .5; }
  .row b { font-weight: 700; }
  .count { font-family: "Barlow"; font-size: 60px; letter-spacing: .04em; line-height: 1; text-transform: uppercase; }
  .each { font-size: 24px; margin-top: 12px; text-transform: uppercase; }
  .net { font-family: "Anton"; font-size: 170px; line-height: 1; margin-top: 2px; letter-spacing: -.01em; }
  .free { font-size: 20px; margin-top: 10px; text-transform: uppercase; line-height: 1.3; }
  .gary { position: absolute; right: -40px; bottom: -10px; height: 930px; filter: drop-shadow(0 20px 30px rgba(0, 6, 24, .5)); }
  .gary.still { right: 20px; height: 880px; }
  .shout { position: absolute; left: 722px; top: 70px; font-family: "Anton"; font-size: 122px; line-height: .92; color: var(--gold);
    text-transform: uppercase; letter-spacing: .005em; text-shadow: 0 10px 28px rgba(0, 6, 24, .45); }
</style>
</head>
<body>
<div class="stage">
  <div class="shout" id="shout"></div>
  <img class="gary" id="gary" alt="">
  <div class="ticket">
    <div class="paper">
      <div class="head"><div class="brand">GARY A.I.</div><div class="mono day" id="day"></div></div>
      <div class="rule"></div>
      <div class="title" id="title"></div>
      <div class="rule"></div>
      <div class="mono lines" id="lines"></div>
      <div class="rule"></div>
      <div class="count" id="count"></div>
      <div class="mono each">$10 on every one of them:</div>
      <div class="net" id="net"></div>
      <div class="mono free" id="free"></div>
    </div>
  </div>
</div>
<script>
  // ?d=<base64 json>: { day, title, shout[], rows[{who, bet, price, hit}], count, net, free, gary, still }
  const d = JSON.parse(decodeURIComponent(escape(atob(new URLSearchParams(location.search).get("d")))));
  const $ = (id) => document.getElementById(id);
  $("day").textContent = d.day; $("title").textContent = d.title; $("count").textContent = d.count; $("net").textContent = d.net; $("free").textContent = d.free;
  $("gary").src = d.gary; if (d.still) $("gary").classList.add("still");
  for (const line of d.shout) { const row = document.createElement("div"); row.textContent = line; $("shout").appendChild(row); }
  const box = $("lines");
  for (const r of d.rows) {
    const row = document.createElement("div"); row.className = "row" + (r.hit ? "" : " miss");
    const a = document.createElement("span"); a.textContent = r.who + "  " + r.bet;
    const b = document.createElement("b"); b.textContent = r.price + "  " + (r.hit ? "HIT " : "MISS");
    row.appendChild(a); row.appendChild(b); box.appendChild(row);
  }
  // every dart of the night is on the tape: the type shrinks until the whole list fits
  const room = box.clientHeight, n = Math.max(1, d.rows.length);
  box.style.flex = "none"; box.style.height = room + "px";
  let fs = Math.min(24, room / (n * 1.28));
  const fit = () => { box.style.fontSize = fs + "px"; box.style.lineHeight = (room / n) + "px"; return [...box.children].every((r) => r.scrollWidth <= box.clientWidth + 1); };
  while (fs > 9 && !fit()) fs -= 0.25;
  if (n * fs * 1.28 < room) box.style.lineHeight = Math.min(room / n, fs * 1.6) + "px";
  document.title = "ready";
</script>
</body>
</html>
