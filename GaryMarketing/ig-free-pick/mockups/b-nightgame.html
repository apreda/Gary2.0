<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Shoulders"; src: url(../fonts/BigShouldersDisplay-900.ttf); font-weight: 900; }
@font-face { font-family: "ShouldersText"; src: url(../fonts/BigShouldersText-700.ttf); font-weight: 700; }
@font-face { font-family: "ShouldersText"; src: url(../fonts/BigShouldersText-500.ttf); font-weight: 500; }
:root { --sky: #060E17; --chalk: #F1F1EC; --haze: #9FB3C8; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--sky); }
.poster { position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 100%, #0B1B2C 0%, var(--sky) 60%); }
/* the painting fills the lower part; its own dark sky melts into the poster's */
.art { position: absolute; left: -60px; bottom: 0; width: 1200px; height: 675px;
  background: url(stadium-art.png) center / cover no-repeat;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%); }
.top { position: absolute; left: 64px; right: 64px; top: 58px; display: flex; justify-content: space-between; align-items: center;
  font: 700 34px/1 "ShouldersText"; color: var(--haze); }
.top img { width: 60px; height: 60px; border-radius: 14px; opacity: .95; }
.pick { position: absolute; left: 58px; top: 170px; color: var(--chalk); font: 900 270px/.82 "Shoulders"; letter-spacing: -3px; }
.pick span { display: block; }
.vs { position: absolute; left: 66px; top: 640px; font: 700 52px/1 "ShouldersText"; color: var(--haze); }
.fact { position: absolute; left: 64px; right: 64px; bottom: 64px; color: var(--chalk);
  font: 500 38px/1.2 "ShouldersText"; text-shadow: 0 2px 18px rgba(0,0,0,.85); }
.fact b { display: block; font-weight: 700; font-size: 30px; color: var(--haze); margin-top: 18px; }
</style></head>
<body><div class="poster">
  <div class="art"></div>
  <div class="top"><span>Thursday night, 8:15 ET</span><img src="../gary-icon.png" alt=""></div>
  <div class="pick"><span>Bucs</span><span>+8.5</span></div>
  <div class="vs">at Dallas</div>
  <div class="fact">Dallas gave up 170, 182 and 192 rushing yards in three of four games.<b>Gary's free pick</b></div>
</div></body></html>
