name: Daily Results Check

# MANUAL BACKSTOP ONLY (single-home decision, Aug 17 2026): the local
# com.gary2.daily-results LaunchAgent (5×/day incl. 2am ET, kept awake by
# com.gary.keepawake) is the sole scheduled owner of run-all-results.js, and
# the pg_cron grade-results/grade-props edge functions grade continuously in
# the cloud. Scheduled runs here were a duplicate writer on the same lane.
# Dispatch by hand only when the laptop lane is down. run-all-results.js
# re-grades + UPDATEs every run, so a manual run is always idempotent.
on:
  workflow_dispatch:  # Allow manual trigger

# Share the same database-writer lane as the near-real-time football grader.
# A long full pass and a football pass must never race each other's idempotent
# read/update/insert sequence.
concurrency:
  group: results-grading
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gary2.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gary2.0/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run results script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          TANK01_RAPIDAPI_KEY: ${{ secrets.TANK01_RAPIDAPI_KEY }}
        run: node scripts/run-all-results.js

      - name: Log completion
        run: echo "Results check completed at $(date)"
