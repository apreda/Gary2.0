name: Football Hub Insights — Manual Backstop

# Manual emergency/backfill lane only. Normal NFL/NCAAF Hub refreshes ride the
# established local daily-insights process alongside MLB/NBA. This workflow has
# no schedule, so it cannot become a second primary runner or compete for quota.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: Football Hub league lane to populate
        required: true
        default: NFL,NCAAF
        type: choice
        options:
          - NFL,NCAAF
          - NFL
          - NCAAF

env:
  TZ: America/New_York

concurrency:
  group: hub-insights
  cancel-in-progress: false

jobs:
  run-football-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gary2.0/package-lock.json

      - name: Install dependencies
        working-directory: gary2.0
        run: npm ci --legacy-peer-deps

      - name: Populate NFL and NCAAF Hub lanes
        working-directory: gary2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUB_LEAGUES: ${{ github.event_name == 'workflow_dispatch' && inputs.leagues || 'NFL,NCAAF' }}
        run: |
          case "$HUB_LEAGUES" in
            NFL,NCAAF|NFL|NCAAF) ;;
            *) echo "Unsupported football Hub lane: $HUB_LEAGUES"; exit 2 ;;
          esac
          node run-insight-connections.js --league "$HUB_LEAGUES"

      - name: Summary
        if: always()
        run: echo "Football Hub Insights completed at $(date -u '+%Y-%m-%d %H:%M UTC')"
