name: Football Results — Near Real Time

# Laptop-independent NFL/NCAAF settlement. The Node runner uses the same exact
# game-id + final-status gates as the local grader, but this narrow mode touches
# only football result rows and skips editorial/nightly work.
#
# GitHub cron is UTC. The window covers roughly noon–6am ET in daylight time and
# 11am–5am ET in standard time, including London games and late Hawaii finishes.
# Runs are offset from the top of the hour to avoid GitHub's busiest cron minute.
on:
  schedule:
    - cron: '7,22,37,52 0-9,16-23 * 1,2,8-12 *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional ET slate date (YYYY-MM-DD); blank checks today + yesterday'
        required: false
        default: ''

permissions:
  contents: read

env:
  TZ: America/New_York

# Serialize with the full daily grader. Never cancel a process between its
# result lookup and write; the next scheduled run will wait instead.
concurrency:
  group: results-grading
  cancel-in-progress: false

jobs:
  settle-football:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: gary2.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gary2.0/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Settle final NFL and NCAAF picks and props
        env:
          RESULTS_DATE: ${{ inputs.date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          set -euo pipefail
          args=(--football-settlements)
          if [[ -n "$RESULTS_DATE" ]]; then
            if [[ ! "$RESULTS_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date: expected YYYY-MM-DD" >&2
              exit 2
            fi
            args+=("$RESULTS_DATE")
          fi
          summary_file="$RUNNER_TEMP/football-settlement-outcomes.log"
          node scripts/run-all-results.js "${args[@]}" | tee "$summary_file"
          if ! grep -q '^FOOTBALL_SETTLEMENT_OUTCOME=' "$summary_file"; then
            echo "Settlement runner exited without a structured coverage outcome." >&2
            exit 3
          fi

      - name: Refresh THE SWEAT and AFTER GARY
        if: ${{ !cancelled() }}
        env:
          RESULTS_DATE: ${{ inputs.date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$RESULTS_DATE" ]]; then
            if [[ ! "$RESULTS_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date: expected YYYY-MM-DD" >&2
              exit 2
            fi
            dates=("$RESULTS_DATE")
          else
            dates=("$(date -d yesterday +%F)" "$(date +%F)")
          fi
          proof_failed=0
          for proof_date in "${dates[@]}"; do
            summary_file="$RUNNER_TEMP/football-proof-$proof_date.log"
            if ! node run-football-proof.js --date "$proof_date" | tee "$summary_file"; then
              proof_failed=1
            fi
            if ! grep -q '^FOOTBALL_PROOF_OUTCOME={"status":"complete"' "$summary_file"; then
              echo "Football proof runner did not report a complete outcome for $proof_date." >&2
              proof_failed=1
            fi
          done
          if (( proof_failed != 0 )); then exit 3; fi

      - name: Grade final NFL and NCAAF Hub insights
        if: ${{ !cancelled() }}
        env:
          RESULTS_DATE: ${{ inputs.date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [[ -n "$RESULTS_DATE" ]]; then
            dates=("$RESULTS_DATE")
          else
            dates=("$(date +%F)" "$(date -d yesterday +%F)")
          fi
          for index in "${!dates[@]}"; do
            if (( index > 0 )); then
              # The settlement pass deliberately reserves two BDL starts/minute
              # for this grader. Wait out the rolling window before its second
              # ET slate so the live-score function keeps its own quota.
              sleep 61
            fi
            node run-grade-insights.js --date "${dates[$index]}" --league NFL,NCAAF
          done

      - name: Log completion
        if: always()
        run: echo "Football result check completed at $(date)"
