name: Hub Insights Runner

# MANUAL BACKSTOP ONLY (single-home decision, Aug 17 2026): the local
# com.gary2.daily-insights LaunchAgent is the sole scheduled owner of the
# insight_connections pipeline — it runs the same script on the $0 Claude
# bridge, so scheduled cloud runs here were a paid duplicate writer.
# Dispatch this workflow by hand only when the laptop lane is down.
#
# Additive-freeze still applies: each run only INSERTs rows not already
# stored for the day — a manual run can never replace existing cards.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: League lane to populate
        required: true
        default: MLB,NBA
        type: choice
        options:
          - MLB,NBA
          - NFL,NCAAF
          - NFL
          - NCAAF

env:
  TZ: America/New_York

# Don't cancel a run that's already in progress — an in-flight insights write
# is idempotent but should finish cleanly rather than be killed mid-insert.
concurrency:
  group: hub-insights
  cancel-in-progress: false

jobs:
  run-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gary2.0/package-lock.json

      - name: Install dependencies
        working-directory: gary2.0
        run: npm ci --legacy-peer-deps

      - name: Run Hub Insights Pipeline
        working-directory: gary2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Scheduled runs keep their historical MLB/NBA scope. Manual football
          # dispatches serialize with the manual football backstop.
          HUB_LEAGUES: ${{ github.event_name == 'workflow_dispatch' && inputs.leagues || 'MLB,NBA' }}
        run: |
          case "$HUB_LEAGUES" in
            MLB,NBA|NFL,NCAAF|NFL|NCAAF) ;;
            *) echo "Unsupported Hub league lane: $HUB_LEAGUES"; exit 2 ;;
          esac
          node run-insight-connections.js --league "$HUB_LEAGUES"

      - name: Summary
        if: always()
        run: echo "Hub Insights completed at $(date -u '+%Y-%m-%d %H:%M UTC')"
