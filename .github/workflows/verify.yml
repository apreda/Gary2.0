name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: America/New_York

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gary2.0
    env:
      # Calendar tests initialize a client at import time; these are dummy values.
      # Provider and storage calls in the unit suite use mocks or injected clients.
      SUPABASE_URL: https://example.supabase.test
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gary2.0/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend unit tests
        run: npm test -- --silent=passed-only

  web:
    name: Web unit tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run web unit tests
        run: npm test -- --silent=passed-only
      - name: Generate Next.js route types
        run: npm exec -- next typegen
      - name: Check TypeScript
        run: npm exec -- tsc --noEmit --incremental false
